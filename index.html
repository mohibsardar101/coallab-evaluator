<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COAL Lab Evaluator</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(17, 24, 39, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-focus: rgba(56, 189, 248, 0.4);
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-glow: rgba(37, 99, 235, 0.25);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.1);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.12);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --input-bg: #0d131f;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px 60px;
    }

    .app-shell {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* App Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-weight: 500;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: #34d399;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Main Card */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 22px 20px;
      box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Form Fields */
    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .field-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    select, input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 500;
      outline: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    select:focus, input:focus {
      border-color: var(--card-border-focus);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      padding-right: 36px;
    }
    .select-arrow {
      position: absolute;
      right: 14px;
      pointer-events: none;
      width: 14px;
      height: 14px;
      color: var(--text-muted);
    }

    .input-suffix {
      position: absolute;
      right: 14px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dim);
      pointer-events: none;
    }

    /* Dynamic Student Preview Card */
    .student-preview {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      animation: fadeIn 0.25s ease;
    }
    .student-preview.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .student-avatar {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1e293b, #334155);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .student-details {
      flex: 1;
      min-width: 0;
    }
    .student-name {
      font-size: 0.92rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .student-roll {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 1px;
    }
    .student-status {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .status-graded {
      background: var(--success-bg);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .status-pending {
      background: var(--warning-bg);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.2);
    }

    /* Buttons */
    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    .btn {
      height: 48px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      flex: 1;
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 14px var(--primary-glow);
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:disabled {
      background: #1e293b;
      color: var(--text-dim);
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }
    .btn-delete {
      width: 48px;
      background: var(--danger-bg);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: var(--danger);
      display: none;
      flex-shrink: 0;
    }

    /* Toast Notification */
    .toast {
      display: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 500;
      text-align: center;
      animation: fadeIn 0.2s ease;
    }
    .toast-success { background: var(--success-bg); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
    .toast-error { background: var(--danger-bg); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }

    /* Session Recent Feed */
    .recent-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }
    .recent-header {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      padding: 0 4px;
    }
    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .recent-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(17, 24, 39, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      font-size: 0.85rem;
    }
    .recent-left {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .recent-name { font-weight: 600; color: #fff; }
    .recent-meta { font-size: 0.72rem; color: var(--text-dim); }
    .recent-badge {
      font-weight: 700;
      color: #34d399;
      background: var(--success-bg);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="brand-title">COAL LAB Evaluator</div>
        <div class="brand-subtitle">BAI-3C • Fall 2026</div>
      </div>
      <div id="statusPill" class="status-pill">
        <span class="status-dot"></span>
        <span id="statusText">Connecting</span>
      </div>
    </header>

    <!-- Evaluation Card -->
    <div class="card">
      <!-- 1. Select Lab -->
      <div class="field">
        <label class="field-label" for="labSelect">1. Lab Session</label>
        <div class="input-wrapper">
          <select id="labSelect">
            <option value="L2" selected>Lab 2 (L2)</option>
            <option value="L3">Lab 3 (L3)</option>
            <option value="L4">Lab 4 (L4)</option>
            <option value="L5">Lab 5 (L5)</option>
            <option value="L6">Lab 6 (L6)</option>
            <option value="L8">Lab 8 (L8)</option>
            <option value="L10">Lab 10 (L10)</option>
            <option value="L11">Lab 11 (L11)</option>
            <option value="L12">Lab 12 (L12)</option>
            <option value="L13">Lab 13 (L13)</option>
            <option value="L14">Lab 14 (L14)</option>
          </select>
          <svg class="select-arrow" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.283a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </div>
      </div>

      <!-- 2. Roll Number -->
      <div class="field">
        <label class="field-label" for="rollInput">2. Roll Number</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="rollInput" 
            list="studentsDatalist" 
            placeholder="Type roll no (e.g. 0001 or 251-0001)" 
            autocomplete="off"
            autocapitalize="none"
          >
          <datalist id="studentsDatalist"></datalist>
        </div>
      </div>

      <!-- Live Student Information Card -->
      <div class="student-preview" id="studentCard">
        <div class="student-avatar" id="avatarText">AI</div>
        <div class="student-details">
          <div class="student-name" id="previewName">—</div>
          <div class="student-roll" id="previewRoll">—</div>
        </div>
        <div class="student-status" id="previewStatus">Pending</div>
      </div>

      <!-- 3. Marks Input -->
      <div class="field">
        <label class="field-label" for="marksInput">3. Score</label>
        <div class="input-wrapper">
          <input 
            type="number" 
            id="marksInput" 
            step="0.5" 
            min="0" 
            max="10" 
            placeholder="Enter score" 
            inputmode="decimal"
          >
          <span class="input-suffix">/ 10</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="button-row">
        <button class="btn btn-delete" id="deleteBtn" title="Delete Score" onclick="handleDelete()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
        <button class="btn btn-primary" id="saveBtn" onclick="handleSave()" disabled>
          Save Mark
        </button>
      </div>

      <div id="toast" class="toast"></div>
    </div>

    <!-- Live Session History -->
    <div class="recent-section" id="recentSection" style="display: none;">
      <div class="recent-header">Recent Evaluations This Session</div>
      <div class="recent-list" id="recentList"></div>
    </div>
  </div>

  <script>
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
    const API_URL = "https://script.google.com/macros/s/AKfycbyqriYBVbeLpVFLY3-cPCR3PFEuH8xTLA505LobIyEa6Ms24Yb4yQXSWtAxkbZdZz_r/exec";

    let students = [];
    let currentStudent = null;
    const sessionHistory = [];

    async function init() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        students = data.students || [];

        // Build datalist options
        const dl = document.getElementById('studentsDatalist');
        dl.innerHTML = '';
        students.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.rollNo;
          opt.label = s.name;
          dl.appendChild(opt);
        });

        updateStatus(true, "Synced");
      } catch (err) {
        updateStatus(false, "Offline");
      }
    }

    function updateStatus(online, text) {
      const pill = document.getElementById('statusPill');
      const label = document.getElementById('statusText');
      label.textContent = text;
      if (online) {
        pill.style.background = 'rgba(16, 185, 129, 0.1)';
        pill.style.borderColor = 'rgba(16, 185, 129, 0.25)';
        pill.style.color = '#34d399';
      } else {
        pill.style.background = 'rgba(239, 68, 68, 0.1)';
        pill.style.borderColor = 'rgba(239, 68, 68, 0.25)';
        pill.style.color = '#f87171';
      }
    }

    function showToast(msg, isSuccess = true) {
      const t = document.getElementById('toast');
      t.className = `toast ${isSuccess ? 'toast-success' : 'toast-error'}`;
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2500);
    }

    function getInitials(name) {
      return name.split(' ').map(n => n[0]).slice(0, 2).join('').toUpperCase();
    }

    function lookupStudent() {
      const query = document.getElementById('rollInput').value.trim().toLowerCase();
      const lab = document.getElementById('labSelect').value;
      const card = document.getElementById('studentCard');
      const nameEl = document.getElementById('previewName');
      const rollEl = document.getElementById('previewRoll');
      const avatarEl = document.getElementById('avatarText');
      const statusEl = document.getElementById('previewStatus');
      const marksInput = document.getElementById('marksInput');
      const saveBtn = document.getElementById('saveBtn');
      const deleteBtn = document.getElementById('deleteBtn');

      if (!query) {
        card.classList.remove('active');
        saveBtn.disabled = true;
        deleteBtn.style.display = 'none';
        currentStudent = null;
        return;
      }

      currentStudent = students.find(s => 
        s.rollNo.toLowerCase() === query || 
        s.rollNo.toLowerCase().endsWith(query)
      );

      if (currentStudent) {
        card.classList.add('active');
        avatarEl.textContent = getInitials(currentStudent.name);
        nameEl.textContent = currentStudent.name;
        rollEl.textContent = currentStudent.rollNo;
        saveBtn.disabled = false;

        const score = currentStudent.marks[lab];
        const isGraded = score !== null && score !== undefined && score !== "";

        if (isGraded) {
          statusEl.className = "student-status status-graded";
          statusEl.textContent = `Graded: ${score} / 10`;
          marksInput.value = score;
          saveBtn.textContent = "Update Mark";
          deleteBtn.style.display = "inline-flex";
        } else {
          statusEl.className = "student-status status-pending";
          statusEl.textContent = "Pending";
          marksInput.value = "";
          saveBtn.textContent = "Save Mark";
          deleteBtn.style.display = "none";
        }
      } else {
        card.classList.remove('active');
        saveBtn.disabled = true;
        deleteBtn.style.display = 'none';
      }
    }

    async function handleSave() {
      if (!currentStudent) return;
      const lab = document.getElementById('labSelect').value;
      const marksVal = document.getElementById('marksInput').value;

      if (marksVal === "") {
        showToast("Please enter marks between 0 and 10.", false);
        return;
      }

      const scoreNum = Number(marksVal);
      if (scoreNum < 0 || scoreNum > 10) {
        showToast("Score must be between 0 and 10.", false);
        return;
      }

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";

      // Optimistic update
      currentStudent.marks[lab] = scoreNum;
      pushRecent(currentStudent.name, currentStudent.rollNo, lab, scoreNum);

      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            rollNo: currentStudent.rollNo,
            labName: lab,
            marks: scoreNum,
            action: "save"
          })
        });

        showToast(`Saved ${scoreNum}/10 for ${currentStudent.name}`);
        
        // Reset inputs and focus back for the next student
        document.getElementById('rollInput').value = '';
        document.getElementById('marksInput').value = '';
        lookupStudent();
        document.getElementById('rollInput').focus();
      } catch (e) {
        showToast("Network error. Try again.", false);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Save Mark";
      }
    }

    async function handleDelete() {
      if (!currentStudent) return;
      const lab = document.getElementById('labSelect').value;
      
      if (!confirm(`Delete score for ${currentStudent.name} (${currentStudent.rollNo}) in ${lab}?`)) return;

      currentStudent.marks[lab] = null;
      lookupStudent();

      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            rollNo: currentStudent.rollNo,
            labName: lab,
            action: "delete"
          })
        });

        showToast(`Score cleared for ${currentStudent.name}`);
        document.getElementById('rollInput').value = '';
        lookupStudent();
      } catch (e) {
        showToast("Failed to delete score.", false);
      }
    }

    function pushRecent(name, roll, lab, marks) {
      sessionHistory.unshift({ name, roll, lab, marks });
      if (sessionHistory.length > 3) sessionHistory.pop();
      renderRecent();
    }

    function renderRecent() {
      const section = document.getElementById('recentSection');
      const list = document.getElementById('recentList');
      if (sessionHistory.length === 0) return;

      section.style.display = 'flex';
      list.innerHTML = sessionHistory.map(item => `
        <div class="recent-item">
          <div class="recent-left">
            <span class="recent-name">${item.name}</span>
            <span class="recent-meta">${item.roll} • ${item.lab}</span>
          </div>
          <span class="recent-badge">${item.marks} / 10</span>
        </div>
      `).join('');
    }

    document.getElementById('rollInput').addEventListener('input', lookupStudent);
    document.getElementById('labSelect').addEventListener('change', lookupStudent);
    document.getElementById('marksInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleSave();
    });

    init();
  </script>
</body>
</html>
